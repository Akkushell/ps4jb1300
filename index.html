<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GamecrackerS Jailbreak Exploit</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; padding:0; min-height:100%; background:#090909; color:#eee5cc;
               font:15px/1.45 "Segoe UI", system-ui, sans-serif; }
  body { min-height:100vh; display:flex; flex-direction:column;
         background:radial-gradient(circle at 50% -20%, #211a0b 0, #090909 48%); }
  #wrap { max-width:760px; margin:24px auto; padding:18px 20px; border:1px solid #3b3017;
          border-radius:8px; background:rgba(15,15,15,.94); box-shadow:0 8px 28px rgba(0,0,0,.4); }
  #state { font-size:22px; font-weight:700; margin:0 0 8px; color:#f4d06f; }
  #det { font-size:13px; color:#a99f88; margin:0 0 4px; }
  #det b { color:#eee5cc; font-weight:600; }
  #cache { font-size:12px; color:#706853; margin:0 0 10px; min-height:14px; }
  #cache.cacheok { color:#d4af37; }
  .ok { color:#d4af37; } .bad { color:#e07a5f; } .warn { color:#f0c75e; }
  #brand { text-align:center; padding:16px 10px 14px; background:#0f0f0f;
           border-bottom:1px solid #5a4314; box-shadow:0 2px 12px rgba(0,0,0,.45); }
  #brand img { width:56px; height:56px; margin:0 auto 6px; border-radius:50%;
               display:block; margin-left:auto; margin-right:auto; }
  #brand b { display:block; font-size:21px; font-weight:700; letter-spacing:.12em;
             color:#f4d06f; }
  #brand-details { margin-top:5px; color:#d8c27a; font-size:12px; letter-spacing:.04em; }
  #brand-details span + span { margin-left:14px; }
  #site-footer { width:100%; box-sizing:border-box; max-width:760px; margin: auto auto 20px;
                 padding:22px 20px 14px;
                 border-top:1px solid #80621c; border-radius:8px 8px 0 0;
                 background:linear-gradient(145deg,#15130d,#0c0c0c 65%);
                 box-shadow:0 -8px 24px rgba(0,0,0,.25); }
  #footer-grid { display:grid; grid-template-columns:1.35fr 1fr 1fr; gap:22px; }
  #site-footer h2 { margin:0 0 7px; color:#f4d06f; font-size:16px; letter-spacing:.08em; }
  #site-footer h3 { margin:0 0 7px; color:#d4af37; font-size:12px; letter-spacing:.14em;
                    text-transform:uppercase; }
  #site-footer p { margin:0; color:#bdb39a; font-size:12px; }
  #site-footer a { color:#e0bd58; text-decoration:none; }
  #site-footer a:hover { color:#fff0a8; text-decoration:underline; }
  #footer-bottom { margin-top:18px; padding-top:10px; border-top:1px solid #302611;
                  text-align:center; color:#706853; font-size:11px; }
  @media (max-width:480px) {
    #brand-details span { display:block; }
    #brand-details span + span { margin:3px 0 0; }
    #wrap { margin:16px 10px; padding:16px; }
    #site-footer { width:auto; margin:auto 10px 14px; padding:18px 16px 12px; }
    #footer-grid { grid-template-columns:1fr; gap:16px; }
  }
  ::selection { background:#d4af37; color:#090909; }
</style>
</head>
<body>
<div id="brand"><img src="logo_raw.png" alt="" width="56" height="56"><b>GamecrackerS</b><div id="brand-details"><span>Console Repair &amp; Support</span><span>Jailbreak Exploit</span></div></div>

<div id="wrap">
  <div id="state">GamecrackerS IS DETECTING FIRMWARE ...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>
<footer id="site-footer">
  <div id="footer-grid">
    <div><h2>GamecrackerS</h2><p>Trusted game console repair in Nagpur for PlayStation, Xbox, and Nintendo Switch.</p></div>
   
  </div>
  <div id="footer-bottom">© 2026 GamecrackerS · Console repair, support &amp; service</div>
</footer>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    // Firmwares this build has a MEASURED kernel table for. jb.js still runs its
    // own kernel-table-present gate, so this is UX only -- an unlisted firmware
    // can still be launched with a tap. KEEP IN SYNC with ps4_offsets.js: add a
    // fwnum here in the SAME commit that fills that firmware's kernel RVAs.
    // The PS4 reports its minor as two hex digits in the UA (13.52 -> minor 0x52).
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 }; // all measured on hardware

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + (supported ? " &middot; <b>supported</b>"
                     : " &middot; not in this build's kernel table");

    var target = "jb.html" + location.search;
    function go() { setState("loading jailbreak...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    // Off-target consoles are not launched automatically -- one tap still runs
    // it, so a user-agent quirk on the real 13.52 console can never lock it out.
    if (!supported) {
        setState("UNSUPPORTED FIRMWARE", "bad");
        waitForTap("UNSUPPORTED (" + (key || "unknown") + ") -- press X or tap to run anyway", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
